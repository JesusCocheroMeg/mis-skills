<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITULO}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Plantilla de analizar-aplicativo: estilo de las láminas de ARM (paleta azul, tarjetas, claro y oscuro). */
:root{
  --brand:#1565c0; --brand-light:#4f9de8; --on-brand:#ffffff;
  --background:#f3f6fa; --card:#ffffff; --surface-alt:#eaf0f7;
  --fg:#13202f; --muted:#50607a; --subtle:#7a879a;
  --ok-soft:#e8f3ec; --ok-ink:#136b34; --pending-soft:#f8eedd; --pending-ink:#8a4f06;
  --business-soft:#e3f4f8; --business-ink:#0e7490; --ai-soft:#fdf1db; --ai-ink:#7a5208; --jarmeg:#f0a92c;
  --code-bg:#f6f8fb;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --brand:#5ea8f2; --brand-light:#8cc2f7; --on-brand:#0b1726;
  --background:#0d141d; --card:#141d28; --surface-alt:#1b2633;
  --fg:#e6edf5; --muted:#a3b1c2; --subtle:#7c8a9c;
  --ok-soft:#16301f; --ok-ink:#7fd79e; --pending-soft:#33270f; --pending-ink:#f0c27a;
  --business-soft:#10303a; --business-ink:#66d9e8; --ai-soft:#352a12; --ai-ink:#f6cf85;
  --code-bg:#101822; color-scheme:dark}}
:root[data-theme="dark"]{
  --brand:#5ea8f2; --brand-light:#8cc2f7; --on-brand:#0b1726;
  --background:#0d141d; --card:#141d28; --surface-alt:#1b2633;
  --fg:#e6edf5; --muted:#a3b1c2; --subtle:#7c8a9c;
  --ok-soft:#16301f; --ok-ink:#7fd79e; --pending-soft:#33270f; --pending-ink:#f0c27a;
  --business-soft:#10303a; --business-ink:#66d9e8; --ai-soft:#352a12; --ai-ink:#f6cf85;
  --code-bg:#101822; color-scheme:dark}
:root{
  --brand-soft:color-mix(in srgb,var(--brand) 7%,var(--card));
  --brand-soft-2:color-mix(in srgb,var(--brand) 13%,var(--card));
  --line:color-mix(in srgb,var(--fg) 9%,transparent);
  --shadow-card:0 4px 14px -6px color-mix(in srgb,var(--fg) 14%,transparent);
  --greet-from:color-mix(in srgb,var(--brand) 4%,var(--card));
  --greet-mid:color-mix(in srgb,var(--brand) 9%,var(--card));
  --greet-to:color-mix(in srgb,var(--brand-light) 22%,var(--card));
}

*{box-sizing:border-box}
body{margin:0;background:var(--background);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px 64px}
.deck{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.slide{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-card);padding:clamp(22px,4.5vw,48px);display:flex;flex-direction:column;gap:18px;min-width:0}
.slide.soft{background:var(--card)}
.slide.full{background:linear-gradient(135deg,var(--greet-from),var(--greet-mid) 55%,var(--greet-to));border-color:var(--line)}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.015em;color:var(--fg)}
h1{font-size:clamp(32px,5.5vw,52px);font-weight:800;line-height:1.08}
h2{font-size:clamp(22px,3.2vw,32px);font-weight:700;line-height:1.2;position:relative;padding-bottom:9px}
h2::after{content:"";position:absolute;left:0;bottom:0;width:48px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--brand),var(--brand-light))}
.next h2::after{display:none}
h3{font-size:16px;font-weight:700}
p{margin:0;max-width:68ch}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--brand)}
.lead{font-size:clamp(16px,1.9vw,19px);color:var(--muted)}
.muted{color:var(--muted)}
.q{display:inline-flex;align-items:center;gap:10px;font-weight:600;background:var(--brand-soft-2);color:var(--brand);border-radius:999px;padding:5px 14px;font-size:13px;align-self:flex-start}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.box{border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:8px;min-width:0;background:var(--card)}
.box.tint{background:var(--brand-soft);border-color:color-mix(in srgb,var(--brand) 14%,transparent)}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;align-self:flex-start}
.tag.ok{background:var(--ok-soft);color:var(--ok-ink)}
.tag.prop{background:var(--business-soft);color:var(--business-ink)}
.tag.tbd{background:var(--pending-soft);color:var(--pending-ink)}
.tag.ex{background:var(--ai-soft);color:var(--ai-ink)}
pre{margin:0;background:var(--code-bg);border:1px solid var(--line);border-radius:12px;padding:16px 18px;overflow-x:auto;font-family:var(--mono);font-size:12.5px;line-height:1.65;color:var(--fg)}
code{font-family:var(--mono);font-size:.88em;background:var(--brand-soft-2);color:var(--brand);padding:1px 6px;border-radius:6px}
h2 code{font-size:.8em}
pre .k{color:var(--brand);font-weight:500}
pre .c{color:var(--subtle)}
.scroll{overflow-x:auto;min-width:0;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:560px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--surface-alt)}
td.mono{font-family:var(--mono);font-size:12.5px}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;counter-reset:s}
.step{border-radius:16px;padding:16px;background:var(--surface-alt);display:flex;flex-direction:column;gap:6px;min-width:0}
.step::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--brand);color:var(--on-brand);font-weight:700;font-size:14px}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;align-items:start}
.split > *{min-width:0}
ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.legend{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.toc{display:flex;flex-direction:column;gap:8px}
.toc a{color:var(--brand);text-decoration:none;font-weight:600;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;align-self:flex-start}
.toc a:hover{background:var(--brand-soft)}
a:focus-visible{outline:2px solid var(--brand);outline-offset:3px}
.next{border:2px dashed var(--line);background:transparent;box-shadow:none}
table.checks td:nth-child(n+2):nth-child(-n+5){text-align:center;font-weight:700;color:var(--ok-ink)}
table.checks td:last-child{color:var(--muted);font-size:12.5px}
.phases{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.phases span{border-radius:12px;padding:8px 12px;background:var(--surface-alt);font-weight:600;font-size:13.5px}
.phases span.done{background:var(--ok-soft);color:var(--ok-ink)}
.phases span.now{background:var(--brand);color:var(--on-brand)}
.phases i{color:var(--muted);font-style:normal}
.analogy{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.analogy .box h3 .ico{font-size:22px;margin-right:6px}
.pick{border:2px solid var(--brand)}
.mini{font-size:13px;color:var(--muted)}
.decide{display:flex;flex-direction:column;gap:12px}
.decide .box h3{display:flex;gap:10px;align-items:baseline}
/* --- Componentes propios de analizar-aplicativo --- */
.tag.idea{background:var(--surface-alt);color:var(--muted)}
td .tag,td .marca,td .veredicto{white-space:nowrap}
/* Marcas de fuente: toda afirmación importante lleva una */
.marca{display:inline-block;font-size:11.5px;font-weight:600;border-radius:6px;padding:1px 7px;vertical-align:1px}
.marca.comprobado{background:var(--ok-soft);color:var(--ok-ink)}
.marca.deducido{background:var(--business-soft);color:var(--business-ink)}
.marca.confirmar{background:var(--pending-soft);color:var(--pending-ink)}
.fuente{font-family:var(--mono);font-size:11.5px;color:var(--subtle)}
/* Veredicto de alcance y límites */
.veredicto{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px}
.veredicto.sostiene{background:var(--ok-soft);color:var(--ok-ink)}
.veredicto.limite{background:var(--pending-soft);color:var(--pending-ink)}
.veredicto.frena{background:color-mix(in srgb,#c62828 14%,var(--card));color:color-mix(in srgb,#c62828 80%,var(--fg))}
/* Qué mirar y qué preguntar */
.preguntar{border-left:4px solid var(--brand);background:var(--brand-soft);border-radius:0 14px 14px 0;padding:14px 18px;display:flex;flex-direction:column;gap:6px}
.preguntar h3{font-size:14px;color:var(--brand)}
/* Diagramas SVG en línea */
.diagram{width:100%;height:auto;display:block;min-width:560px}
.diagram text{font-family:var(--font);fill:var(--fg)}
.diagram .lbl{font-size:13px;font-weight:600}
.diagram .sm{font-size:11.5px;fill:var(--muted)}
.diagram .node{fill:var(--card);stroke:var(--line);stroke-width:1.5}
.diagram .node.b{fill:var(--brand-soft-2);stroke:var(--brand)}
.diagram .node.ok{fill:var(--ok-soft);stroke:var(--ok-ink)}
.diagram .node.w{fill:var(--pending-soft);stroke:var(--pending-ink)}
.diagram .arr{stroke:var(--brand);stroke-width:2;fill:none;marker-end:url(#ah)}
.diagram .arr.d{stroke-dasharray:5 4;stroke:var(--pending-ink);marker-end:url(#ahw)}
.diagram .head{fill:var(--brand)} .diagram .headw{fill:var(--pending-ink)}
.lado{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.lado > .box h3 .quien{font-size:12px;font-weight:600;color:var(--brand);text-transform:uppercase;letter-spacing:.06em;display:block}
</style></head>
<body>
<main class="deck">
{{CONTENIDO}}
</main>
</body>
</html>
