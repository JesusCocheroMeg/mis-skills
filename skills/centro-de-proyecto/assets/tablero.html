<title>{{TITULO}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap">
<style>
/* Layout: app de una pantalla — menú lateral en escritorio, barra inferior en el celular; vistas Inicio, Proyecto, Tareas, Notas. Marca JC: azul + Manrope */
:root {
  --bg: #f4f6fb; --surface: #ffffff; --surface-2: #edf1fa; --fg: #1b2233; --muted: #6b7590;
  --line: #e1e6f0; --accent: #3a6dff; --accent-fg: #ffffff; --accent-soft: #e4ebff;
  --ok: #1f8a5b; --ok-soft: #e1f3ea; --warn: #a8620a; --warn-soft: #fbefdc; --bad: #c0392b; --bad-soft: #fbe4e1;
  --nav-bg: rgba(255,255,255,.86);
  --font: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0a0f1c; --surface: #121a2c; --surface-2: #16213b; --fg: #eaf0ff; --muted: #9aa7c4;
  --line: #25304a; --accent: #6a92ff; --accent-fg: #0a0f1c; --accent-soft: #1a2750;
  --ok: #4cc58c; --ok-soft: #12291f; --warn: #f0b049; --warn-soft: #2e2412; --bad: #ff7a6b; --bad-soft: #321a19;
  --nav-bg: rgba(18,26,44,.86); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0a0f1c; --surface: #121a2c; --surface-2: #16213b; --fg: #eaf0ff; --muted: #9aa7c4;
  --line: #25304a; --accent: #6a92ff; --accent-fg: #0a0f1c; --accent-soft: #1a2750;
  --ok: #4cc58c; --ok-soft: #12291f; --warn: #f0b049; --warn-soft: #2e2412; --bad: #ff7a6b; --bad-soft: #321a19;
  --nav-bg: rgba(18,26,44,.86); color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.5 }
h1, h2, h3, p { margin: 0 }
h1, h2, h3 { text-wrap: balance }
a { color: var(--accent) }
button { font: inherit; cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

/* Estructura */
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh }
.side { position: sticky; top: 0; height: 100vh; border-right: 1px solid var(--line); background: var(--surface);
  padding: 22px 14px; display: flex; flex-direction: column; gap: 22px }
.logo { font-weight: 800; font-size: 1.05rem; letter-spacing: -.01em; padding: 0 8px; display: flex; flex-direction: column; gap: 2px }
.logo .b { color: var(--accent) }
.logo small { font-size: .74rem; color: var(--muted); font-weight: 600 }
.side nav { display: flex; flex-direction: column; gap: 4px }
.nav-btn { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; border: 0;
  background: transparent; color: var(--muted); font-weight: 700; text-align: left; width: 100% }
.nav-btn svg { width: 19px; height: 19px; flex: none }
.nav-btn:hover { background: var(--surface-2); color: var(--fg) }
.nav-btn[aria-current="page"] { background: var(--accent-soft); color: var(--accent) }
.nav-btn .cnt { margin-left: auto; font-size: .72rem; background: var(--accent); color: var(--accent-fg); border-radius: 999px;
  padding: 0 7px; min-width: 20px; text-align: center; font-variant-numeric: tabular-nums }
.nav-btn .cnt:empty { display: none }
.side .sync { margin-top: auto; font-size: .76rem; color: var(--muted); padding: 0 8px }
.main { min-width: 0; padding-block: 28px 56px;
  padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)) }
.view { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px }
.bottom { display: none }

@media (max-width: 899px) {
  .app { grid-template-columns: minmax(0, 1fr) }
  .side { display: none }
  .main { padding-block: 18px calc(92px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
  .bottom { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: var(--nav-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line);
    padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)) }
  .bottom .nav-btn { flex-direction: column; gap: 2px; font-size: .7rem; padding: 6px 2px; position: relative; align-items: center; text-align: center }
  .bottom .nav-btn .cnt { position: absolute; top: 2px; left: calc(50% + 6px); margin: 0; font-size: .64rem; padding: 0 5px; min-width: 16px }
  .bottom .nav-btn[aria-current="page"] { background: transparent }
}

/* Piezas comunes */
.eyebrow { font-size: .76rem; font-weight: 700; color: var(--muted); letter-spacing: .06em; text-transform: uppercase }
.title { font-size: 1.7rem; font-weight: 800; letter-spacing: -.02em; line-height: 1.2 }
.lead { color: var(--muted); max-width: 62ch }
.head { display: flex; flex-direction: column; gap: 8px }
.meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: .8rem; color: var(--muted) }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: var(--surface-2);
  color: var(--fg); font-size: .78rem; font-weight: 700; text-decoration: none; border: 1px solid var(--line) }
a.chip:hover { border-color: var(--accent); color: var(--accent) }
.chip.acc { background: var(--accent-soft); color: var(--accent); border-color: transparent }
.sec { display: flex; flex-direction: column; gap: 12px }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap }
.sec-h h2 { font-size: 1.05rem; font-weight: 800 }
.link-btn { border: 0; background: none; color: var(--accent); font-weight: 700; font-size: .85rem; padding: 0 }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px }
.msg { background: var(--accent-soft); border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px }
.msg .who { font-size: .74rem; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: .06em }
.msg p { white-space: pre-wrap }
.empty { padding: 16px; border-radius: 12px; background: var(--surface-2); color: var(--muted); font-size: .9rem }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; text-align: left; color: var(--fg) }
button.stat:hover { border-color: var(--accent) }
.stat b { display: block; font-size: 1.6rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.2 }
.stat span { font-size: .76rem; color: var(--muted); font-weight: 700 }
@media (max-width: 600px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)) } }

/* Tareas */
.list { display: flex; flex-direction: column; gap: 6px }
.tarea { display: flex; gap: 12px; align-items: flex-start; padding: 11px 13px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px }
.tarea input { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--accent); flex: none }
.tarea .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px }
.tarea label { font-weight: 700; overflow-wrap: anywhere; cursor: pointer }
.tarea.hecho label { text-decoration: line-through; color: var(--muted) }
.tarea .sub { font-size: .82rem; color: var(--muted); overflow-wrap: anywhere }
.pills { display: flex; gap: 6px; flex-wrap: wrap }
.pill { font-size: .68rem; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted) }
.p-prio { background: var(--warn-soft); color: var(--warn) }
.p-bloq { background: var(--bad-soft); color: var(--bad) }
.p-curso { background: var(--accent-soft); color: var(--accent) }
.p-ok { background: var(--ok-soft); color: var(--ok) }
.grupo { display: flex; flex-direction: column; gap: 6px }
.grupo-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 6px }
.grupo-h h3 { font-size: .95rem; font-weight: 800 }
.bar { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; width: 90px; flex: none }
.bar i { display: block; height: 100%; background: var(--ok); border-radius: 99px }
.prog { display: flex; align-items: center; gap: 8px; font-size: .76rem; color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums }
.filtros { display: flex; gap: 6px; flex-wrap: wrap }
.filtros button { padding: 6px 13px; border-radius: 999px; font-size: .82rem; font-weight: 700; border: 1px solid var(--line); background: var(--surface); color: var(--fg) }
.filtros button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg) }

/* Notas */
.composer { display: flex; flex-direction: column; gap: 10px }
textarea { width: 100%; min-height: 84px; resize: vertical; font: inherit; color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px }
.row { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap }
.hint { font-size: .8rem; color: var(--muted) }
.hint.err { color: var(--bad) }
.btn { font-weight: 800; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); padding: 10px 16px; min-height: 44px }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg) }
.btn:disabled { opacity: .5; cursor: default }
.nota { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px }
.nota-top { display: flex; justify-content: space-between; gap: 10px; align-items: center }
.nota time { font-size: .74rem; color: var(--muted); font-weight: 700 }
.nota p { white-space: pre-wrap; overflow-wrap: anywhere }
.nota .resp { border-left: 3px solid var(--accent); padding-left: 10px; font-size: .88rem; color: var(--muted) }
.nota .resp b { color: var(--accent); font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; display: block }
.x { border: 0; background: none; color: var(--muted); font-size: .8rem; font-weight: 700; padding: 4px 6px }
.x:hover { color: var(--bad) }

/* Proyecto */
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(240px, 100%), 1fr)); gap: 10px }
.pieza { display: flex; flex-direction: column; gap: 6px; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px }
.pieza-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px }
.pieza h3 { font-size: .95rem; font-weight: 800; overflow-wrap: anywhere }
.pieza p { font-size: .86rem; color: var(--muted) }
.pieza a { font-size: .82rem; font-weight: 700; text-decoration: none; overflow-wrap: anywhere }
.deflist { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0 }
.deflist div { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 12px; padding: 10px 0; border-top: 1px solid var(--line) }
.deflist div:first-child { border-top: 0; padding-top: 0 }
.deflist dt { font-size: .8rem; font-weight: 800; color: var(--muted) }
.deflist dd { margin: 0 }
@media (max-width: 600px) { .deflist div { grid-template-columns: minmax(0, 1fr); gap: 2px } }
.dec { display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line) }
.dec:first-child { border-top: 0; padding-top: 0 }
.dec code { font-family: var(--mono); font-size: .78rem; color: var(--accent); font-weight: 700; flex: none; padding-top: 2px }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px }
.chips { display: flex; gap: 6px; flex-wrap: wrap }
.footer-note { font-size: .8rem; color: var(--muted) }

/* Chat */
.chat { display: flex; flex-direction: column; gap: 10px }
.burbuja { max-width: 88%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.55 }
.burbuja.yo { align-self: flex-end; background: var(--accent); color: var(--accent-fg); border-bottom-right-radius: 4px }
.burbuja.claude { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 4px }
.burbuja.pensando { color: var(--muted); font-style: italic }
.burbuja time { display: block; font-size: .68rem; font-weight: 700; opacity: .7; margin-top: 4px; font-style: normal }
.acciones { align-self: flex-start; display: flex; flex-direction: column; gap: 4px; font-size: .78rem; color: var(--ok); font-weight: 700 }
.sugeridas { display: flex; gap: 8px; flex-wrap: wrap }
.sugeridas button { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 7px 13px; font-size: .84rem; font-weight: 700 }
.sugeridas button:hover { border-color: var(--accent); color: var(--accent) }
.chat-box { position: sticky; bottom: 0; background: var(--bg); padding-top: 6px }
@media (max-width: 899px) { .chat-box { bottom: calc(76px + env(safe-area-inset-bottom, 0px)) } }
.chat-box textarea { min-height: 56px }

@media (prefers-reduced-motion: no-preference) { .view { animation: in .18s ease-out } @keyframes in { from { opacity: .4; transform: translateY(4px) } } }
</style>

<div class="app">
  <aside class="side" aria-label="Menú">
    <div class="logo"><span><span class="b">{</span> <span id="logo-nombre">Proyecto</span> <span class="b">}</span></span><small id="logo-sub">Tablero del centro</small></div>
    <nav id="nav-side"></nav>
    <p class="sync" id="sync-side"></p>
  </aside>
  <main class="main"><div class="view" id="view"></div></main>
  <nav class="bottom" id="nav-bottom" aria-label="Menú"></nav>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const ICON = {
    inicio: '<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
    proyecto: '<path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2.5h8.5A1.5 1.5 0 0 1 21 9v9.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/>',
    tareas: '<path d="m4 12 5 5L20 6"/>',
    notas: '<path d="M5 4h14a1 1 0 0 1 1 1v10l-5 5H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/><path d="M15 20v-5h5"/>',
    chat: '<path d="M4 5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H9l-5 4V6a1 1 0 0 1 1-1z"/>',
  };
  const VISTAS = [["inicio", "Inicio"], ["proyecto", "Proyecto"], ["tareas", "Tareas"], ["notas", "Notas"], ["chat", "Chat"]];
  const state = { info: null, hoy: null, tareas: [], notas: [], chat: [], listo: { info: false, tareas: false, notas: false, chat: false },
    vista: "inicio", filtroT: "abiertas", filtroN: "todas", sinDb: false, error: "",
    ia: { disponible: null, herramientas: false, enCurso: false, texto: "", acciones: [], aviso: "" } };
  let db = null, sample = null, ctl = null;
  try { const f = localStorage.getItem("tb-filtro"); if (f) state.filtroT = f; } catch (e) {}

  /* utilidades */
  const h = (tag, props = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (v == null || v === false) continue;
      if (k === "text") n.textContent = v; else if (k === "class") n.className = v; else if (k === "html") n.innerHTML = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v === true ? "" : v);
    }
    for (const c of kids.flat()) if (c != null && c !== false) n.append(c);
    return n;
  };
  const svg = (name) => { const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("fill", "none"); s.setAttribute("stroke", "currentColor");
    s.setAttribute("stroke-width", "2"); s.setAttribute("stroke-linecap", "round"); s.setAttribute("stroke-linejoin", "round");
    s.setAttribute("aria-hidden", "true"); s.innerHTML = ICON[name]; return s; };
  const fecha = (iso, corta) => {
    if (!iso) return ""; const d = new Date(iso); if (isNaN(d)) return String(iso);
    const dia = d.toLocaleDateString("es-CO", { day: "numeric", month: "short" });
    return corta ? dia : dia + ", " + d.toLocaleTimeString("es-CO", { hour: "numeric", minute: "2-digit" });
  };
  const saludo = () => { const hr = new Date().getHours(); return hr < 12 ? "Buenos días" : hr < 19 ? "Buenas tardes" : "Buenas noches"; };
  const abiertas = () => state.tareas.filter((t) => t.estado !== "hecho");
  const notasPend = () => state.notas.filter((n) => !n.procesada);
  const ordenar = (a, b) => (b.prioridad ? 1 : 0) - (a.prioridad ? 1 : 0) || (a.orden ?? 99) - (b.orden ?? 99);

  /* navegación */
  function navBtn(id, label, compact) {
    const cnt = id === "tareas" ? abiertas().length : id === "notas" ? notasPend().length : 0;
    return h("button", { type: "button", class: "nav-btn", "aria-current": state.vista === id ? "page" : null,
      onclick: () => ir(id) }, svg(id), h("span", { text: label }), h("span", { class: "cnt", text: cnt && (id !== "tareas" || !compact) ? String(cnt) : "" }));
  }
  function renderNav() {
    $("nav-side").replaceChildren(...VISTAS.map(([id, l]) => navBtn(id, l, false)));
    $("nav-bottom").replaceChildren(...VISTAS.map(([id, l]) => navBtn(id, l, true)));
    const s = state.info && state.info.actualizado ? "Sincronizado con el centro: " + fecha(state.info.actualizado) : "";
    $("sync-side").textContent = s;
    if (state.info) { $("logo-nombre").textContent = state.info.nombre || "Proyecto"; $("logo-sub").textContent = state.info.subtitulo || "Tablero del centro"; }
  }
  function ir(id) {
    if (!VISTAS.some(([v]) => v === id)) id = "inicio";
    state.vista = id;
    if (location.hash !== "#" + id) { try { history.replaceState(null, "", "#" + id); } catch (e) { location.hash = id; } }
    render(true);
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", () => { const v = location.hash.slice(1); if (v && v !== state.vista) ir(v); });

  /* repintado: no se pisa lo que se está escribiendo */
  function escribiendo() { const a = document.activeElement; return a && a.tagName === "TEXTAREA" && a.value.trim() !== ""; }
  function render(forzar) {
    renderNav();
    if (!forzar && escribiendo()) { refrescarListas(); return; }
    const borrador = (document.querySelector("textarea") || {}).value || "";
    const v = $("view");
    v.replaceChildren(...({ inicio: vInicio, proyecto: vProyecto, tareas: vTareas, notas: vNotas, chat: vChat }[state.vista])());
    const ta = v.querySelector("textarea"); if (ta && borrador) ta.value = borrador;
    if (state.vista === "chat" && forzar) { const fin = $("chat-fin"); if (fin) fin.scrollIntoView({ block: "end" }); }
  }
  function refrescarListas() {
    const box = $("notas-lista"); if (box) box.replaceChildren(...listaNotas(state.vista === "inicio" ? 3 : 100));
  }

  /* bloques */
  function estadoDatos() {
    if (state.sinDb) return h("div", { class: "empty", text: "Abre este tablero en claude.ai con tu cuenta para ver y editar los datos." });
    if (state.error) return h("div", { class: "empty", text: state.error });
    return null;
  }
  function tareaRow(t) {
    const id = "t-" + t.id;
    const cb = h("input", { type: "checkbox", id, "aria-label": "Marcar como hecha" });
    cb.checked = t.estado === "hecho";
    cb.addEventListener("change", () => marcar(t, cb));
    const pills = [];
    if (t.prioridad && t.estado !== "hecho") pills.push(h("span", { class: "pill p-prio", text: "Prioridad" }));
    if (t.estado === "bloqueado") pills.push(h("span", { class: "pill p-bloq", text: "Bloqueado" }));
    if (t.estado === "en curso") pills.push(h("span", { class: "pill p-curso", text: "En curso" }));
    if (state.vista === "inicio" && t.grupo) pills.push(h("span", { class: "pill", text: t.grupo }));
    return h("div", { class: "tarea" + (t.estado === "hecho" ? " hecho" : "") }, cb,
      h("div", { class: "txt" }, h("label", { for: id, text: t.titulo || "(sin título)" }),
        t.nota ? h("span", { class: "sub", text: t.nota }) : null,
        pills.length ? h("div", { class: "pills" }, pills) : null));
  }
  function composer(idSufijo) {
    const ta = h("textarea", { id: "nota-" + idSufijo, placeholder: "Lo que no quieres olvidar: una idea, algo que pidió un cliente, un pendiente…", "aria-label": "Nueva nota" });
    const hint = h("span", { class: "hint", id: "hint-" + idSufijo, text: "Claude la pasa a la bitácora del centro al sincronizar." });
    const btn = h("button", { type: "submit", class: "btn primary", text: "Guardar nota", disabled: state.sinDb || null });

    if (!db) { cb.checked = !cb.checked; return; }
    cb.disabled = true;
    try { await db.doc("tareas/" + t.id).update({ estado: cb.checked ? "hecho" : "pendiente", cambioTablero: new Date().toISOString() }); }
    catch (e) { cb.checked = !cb.checked; state.error = "No se pudo guardar el cambio. Revisa tu conexión."; render(true); setTimeout(() => { state.error = ""; render(); }, 5000); }
    finally { cb.disabled = false; }
  }
  async function borrarNota(id) {
    if (!db) return;
    try { await db.doc("notas/" + id).delete(); }
    catch (e) { state.error = "No se pudo borrar la nota."; render(true); setTimeout(() => { state.error = ""; render(); }, 5000); }
  }

  /* arranque */
  state.vista = VISTAS.some(([v]) => v === location.hash.slice(1)) ? location.hash.slice(1) : "inicio";
  render(true);
  (async () => {
    db = window.claude && window.claude.use ? await window.claude.use("db") : null;
    if (!db) { state.sinDb = true; state.ia.disponible = false; state.listo = { info: true, tareas: true, notas: true, chat: true }; render(true); return; }
    (async () => {
      try { sample = window.claude && window.claude.use ? await window.claude.use("sample") : null; } catch (e) { sample = null; }
      state.ia.disponible = !!sample;
      if (sample) { try { const l = await sample.limits(); state.ia.herramientas = !!(l && l.tools); } catch (e) { state.ia.herramientas = false; } }
      render();
    })();
    db.collection("chat").orderBy("en", "asc").onSnapshot((s) => { state.chat = s.docs.map((d) => ({ id: d.id, ...d.data() })); state.listo.chat = true; if (!state.ia.enCurso) render(); }, () => { state.listo.chat = true; });
    let faltan = 4;
    const timer = setTimeout(() => { if (faltan > 0) { state.error = "Los datos tardan en llegar. Revisa tu conexión."; render(); } }, 10000);
    const ok = (snap) => { if (snap.metadata && !snap.metadata.fromCache) { faltan--; if (faltan <= 0) { clearTimeout(timer); if (state.error) { state.error = ""; } } } };
    const fallo = () => { clearTimeout(timer); state.error = "Los datos del tablero no están disponibles en esta vista."; render(); };
    db.doc("proyecto/info").onSnapshot((s) => { state.info = s.exists ? s.data() : null; state.listo.info = true; ok(s); render(); }, fallo);
    db.doc("proyecto/hoy").onSnapshot((s) => { state.hoy = s.exists ? s.data() : null; ok(s); render(); }, fallo);
    db.collection("tareas").onSnapshot((s) => { state.tareas = s.docs.map((d) => ({ id: d.id, ...d.data() })); state.listo.tareas = true; ok(s); render(); }, fallo);
    db.collection("notas").orderBy("creada", "desc").onSnapshot((s) => { state.notas = s.docs.map((d) => ({ id: d.id, ...d.data() })); state.listo.notas = true; ok(s); render(); }, fallo);
  })();
})();
</script>
